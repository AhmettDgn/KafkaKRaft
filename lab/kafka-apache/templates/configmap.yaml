{{- include "lab.validate" . -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "lab.name" . }}-scripts
  labels:
    {{- include "lab.labels" . | nindent 4 }}
data:
  start.sh: |
{{ .Files.Get "files/start.sh" | indent 4 }}
  extra.properties: |
    {{- range $key, $value := .Values.extraConfig }}
    {{ $key }}={{ $value }}
    {{- end }}
{{- if .Values.metrics.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "lab.name" . }}-jmx
  labels:
    {{- include "lab.labels" . | nindent 4 }}
data:
  jmx-exporter.yml: |
    lowercaseOutputName: true
    lowercaseOutputLabelNames: true
    rules:
      - pattern: 'kafka.server<type=(.+), name=(.+)PerSec\w*><>Count'
        name: kafka_server_$1_$2_total
        type: COUNTER
      - pattern: 'kafka.controller<type=(.+), name=(.+)><>Value'
        name: kafka_controller_$1_$2
        type: GAUGE
      - pattern: 'java.lang<type=Memory><HeapMemoryUsage>used'
        name: java_lang_memory_heapmemoryusage_used
        type: GAUGE
{{- end }}
