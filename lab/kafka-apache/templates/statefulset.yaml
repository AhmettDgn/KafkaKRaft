{{- $previous := lookup "apps/v1" "StatefulSet" .Release.Namespace .Release.Name -}}
{{- include "lab.upgradeGuard" (dict "previous" $previous "current" .) -}}
{{- if and .Release.IsUpgrade (not $previous) -}}
{{- fail "Existing release has no StatefulSet: recovery review required, refusing automatic recreation." -}}
{{- end -}}
{{- if and .Release.IsInstall (not $previous) -}}
{{- $claims := lookup "v1" "PersistentVolumeClaim" .Release.Namespace "" -}}
{{- range $claim := $claims.items -}}
{{- if hasPrefix (printf "data-%s-" $.Release.Name) $claim.metadata.name -}}
{{- fail "Existing release PVC found on initial install; explicit recovery is required, not a fresh format." -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- if $previous -}}
{{- if ne (int $previous.spec.replicas) (int .Values.replicaCount) -}}
{{- fail "Static quorum replica count cannot change on upgrade. Create a separate lab release." -}}
{{- end -}}
{{- end }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "lab.name" . }}
  labels:
    {{- include "lab.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  serviceName: {{ include "lab.name" . }}-headless
  podManagementPolicy: Parallel
  minReadySeconds: 30
  updateStrategy:
    type: RollingUpdate
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      {{- include "lab.labels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "lab.labels" . | nindent 8 }}
      annotations:
        kafka-lab/storage-layout: pvc-v2
        kafka-lab/identity-contract: {{ include "lab.identity" . | quote }}
        checksum/scripts: {{ .Files.Get "files/start.sh" | sha256sum }}
        checksum/config: {{ toJson .Values.extraConfig | sha256sum }}
        checksum/security: {{ toJson .Values.security | sha256sum }}
        checksum/metrics: {{ toJson .Values.metrics | sha256sum }}
    spec:
      serviceAccountName: {{ include "lab.serviceAccountName" . }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 120
      nodeSelector:
        kubernetes.io/os: linux
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kafka
          image: {{ include "lab.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/bin/bash", "/scripts/start.sh"]
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - {name: RELEASE_NAME, value: {{ .Release.Name | quote }}}
            - {name: CLUSTER_DOMAIN, value: {{ .Values.clusterDomain | quote }}}
            - {name: REPLICA_COUNT, value: {{ .Values.replicaCount | quote }}}
            - {name: KAFKA_HEAP_OPTS, value: {{ .Values.heapOpts | quote }}}
            - {name: LOG_DIR, value: /tmp/kafka-logs}
            - {name: DATA_VOLUME_ROOT, value: /var/lib/kafka/data}
            - {name: DATA_DIR, value: /var/lib/kafka/data/kraft}
            - {name: SECURITY_ENABLED, value: {{ .Values.security.enabled | quote }}}
            - {name: AUTHORIZATION_ENABLED, value: {{ .Values.security.authorization.enabled | quote }}}
            - {name: ADMIN_PRINCIPAL, value: {{ .Values.security.authorization.adminPrincipal | quote }}}
            - {name: EXTERNAL_ENABLED, value: {{ .Values.externalAccess.enabled | quote }}}
            - {name: EXTERNAL_HOST, value: {{ .Values.externalAccess.advertisedHost | quote }}}
            - {name: METRICS_ENABLED, value: {{ .Values.metrics.enabled | quote }}}
            - {name: METRICS_PORT, value: {{ .Values.metrics.port | quote }}}
            {{- range $ordinal, $port := .Values.externalAccess.nodePorts }}
            - {name: {{ printf "EXTERNAL_NODE_PORT_%d" $ordinal }}, value: {{ $port | quote }}}
            {{- end }}
            {{- if .Values.security.enabled }}
            - {name: TLS_DIR, value: /etc/kafka/tls}
            - {name: AUTH_DIR, value: /etc/kafka/auth}
            {{- end }}
            - name: CLUSTER_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingClusterIdSecret }}
                  key: cluster-id
          ports:
            - {name: client, containerPort: 9092}
            - {name: controller, containerPort: 9093}
            {{- if .Values.externalAccess.enabled }}
            - {name: external, containerPort: 9094}
            {{- end }}
            {{- if .Values.metrics.enabled }}
            - {name: metrics, containerPort: {{ .Values.metrics.port }}}
            {{- end }}
          startupProbe:
            tcpSocket: {port: client}
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            exec:
              command:
                - /bin/bash
                - -ec
                - KAFKA_HEAP_OPTS='-Xms32m -Xmx128m' /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server "${POD_NAME}.${RELEASE_NAME}-headless.${POD_NAMESPACE}.svc.${CLUSTER_DOMAIN}:9092" {{ if .Values.security.enabled }}--command-config /etc/kafka/auth/admin.properties{{ end }} >/dev/null 2>&1
            periodSeconds: 30
            timeoutSeconds: 15
            failureThreshold: 3
          livenessProbe:
            tcpSocket: {port: client}
            periodSeconds: 20
            failureThreshold: 6
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            # Exact image VOLUME target; an ancestor mount is NOT sufficient in containerd.
            - {name: data, mountPath: /var/lib/kafka/data}
            - {name: image-secrets, mountPath: /etc/kafka/secrets, readOnly: true}
            - {name: image-config, mountPath: /mnt/shared/config, readOnly: true}
            - {name: config, mountPath: /work}
            - {name: tmp, mountPath: /tmp}
            - {name: scripts, mountPath: /scripts, readOnly: true}
            - {name: extra-config, mountPath: /work/extra.properties, subPath: extra.properties, readOnly: true}
            {{- if .Values.security.enabled }}
            - {name: tls, mountPath: /etc/kafka/tls, readOnly: true}
            - {name: auth, mountPath: /etc/kafka/auth, readOnly: true}
            {{- end }}
            {{- if .Values.metrics.enabled }}
            - {name: jmx-config, mountPath: /work/jmx-exporter.yml, subPath: jmx-exporter.yml, readOnly: true}
            {{- end }}
      volumes:
        - name: scripts
          configMap:
            name: {{ include "lab.name" . }}-scripts
            defaultMode: 0444
        - name: extra-config
          configMap:
            name: {{ include "lab.name" . }}-scripts
            defaultMode: 0444
        {{- if .Values.security.enabled }}
        - name: tls
          secret:
            secretName: {{ .Values.security.tls.existingSecret }}
            defaultMode: 0440
        - name: auth
          secret:
            secretName: {{ .Values.security.sasl.existingSecret }}
            defaultMode: 0440
        {{- end }}
        {{- if .Values.metrics.enabled }}
        - name: jmx-config
          configMap:
            name: {{ include "lab.name" . }}-jmx
            defaultMode: 0444
        {{- end }}
        - {name: config, emptyDir: {}}
        - {name: tmp, emptyDir: {}}
        - {name: image-secrets, emptyDir: {}}
        - {name: image-config, emptyDir: {}}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "lab.labels" . | nindent 10 }}
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if ne .Values.storage.storageClass "" }}
        storageClassName: {{ .Values.storage.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.storage.size | quote }}
