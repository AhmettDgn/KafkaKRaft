apiVersion: v1
kind: Service
metadata:
  name: {{ include "lab.name" . }}-headless
  labels:
    {{- include "lab.labels" . | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    {{- include "lab.labels" . | nindent 4 }}
  ports:
    - {name: client, port: 9092, targetPort: client}
    - {name: controller, port: 9093, targetPort: controller}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "lab.name" . }}
  labels:
    {{- include "lab.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "lab.labels" . | nindent 4 }}
  ports:
    - {name: client, port: 9092, targetPort: client}
