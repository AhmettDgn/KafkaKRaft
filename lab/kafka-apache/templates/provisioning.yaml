{{- if .Values.provisioning.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "lab.name" . }}-provision-{{ toJson .Values.provisioning | sha256sum | trunc 8 }}
  labels:
    {{- include "lab.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "10"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        {{- include "lab.labels" . | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext: {runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: provision
          image: {{ include "lab.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext: {runAsNonRoot: true, readOnlyRootFilesystem: true, allowPrivilegeEscalation: false, capabilities: {drop: ["ALL"]}}
          command: ["/bin/bash", "-ec"]
          args:
            - |
              bootstrap="{{ include "lab.name" . }}:9092"
              config=/etc/kafka/auth/admin.properties
              {{- range .Values.provisioning.topics }}
              /opt/kafka/bin/kafka-topics.sh --bootstrap-server "$bootstrap" --command-config "$config" --create --if-not-exists --topic {{ .name | quote }} --partitions {{ .partitions }} --replication-factor {{ .replicationFactor }}
              {{- end }}
              {{- range .Values.provisioning.acls }}
              /opt/kafka/bin/kafka-acls.sh --bootstrap-server "$bootstrap" --command-config "$config" --add --allow-principal {{ .principal | quote }} --operation {{ .operation | quote }} --{{ .resourceType }} {{ .resourceName | quote }}
              {{- end }}
          volumeMounts:
            - {name: auth, mountPath: /etc/kafka/auth, readOnly: true}
            - {name: tls, mountPath: /etc/kafka/tls, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: auth
          secret: {secretName: {{ .Values.security.sasl.existingSecret }}, defaultMode: 0440}
        - name: tls
          secret: {secretName: {{ .Values.security.tls.existingSecret }}, defaultMode: 0440}
        - {name: tmp, emptyDir: {}}
{{- end }}
