apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "lab.name" . }}
spec:
  podSelector:
    matchLabels:
      {{- include "lab.labels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: {}
      ports:
        - {protocol: TCP, port: 9092}
    - from:
        - podSelector:
            matchLabels:
              {{- include "lab.labels" . | nindent 14 }}
      ports:
        - {protocol: TCP, port: 9093}
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - podSelector:
            matchLabels:
              {{- include "lab.labels" . | nindent 14 }}
      ports:
        - {protocol: TCP, port: 9092}
        - {protocol: TCP, port: 9093}
