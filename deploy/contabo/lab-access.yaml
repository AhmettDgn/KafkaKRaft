apiVersion: v1
kind: Namespace
metadata:
  name: kafka-lab
  labels:
    app.kubernetes.io/managed-by: kafka-lab-bootstrap
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kafka-lab-deployer
  namespace: kafka-lab
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kafka-lab-deployer
  namespace: kafka-lab
rules:
  - apiGroups: [""]
    resources: [pods, services, configmaps, secrets, persistentvolumeclaims]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [create, get]
  - apiGroups: [""]
    resources: [events]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [statefulsets, replicasets, deployments]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kafka-lab-deployer
  namespace: kafka-lab
subjects:
  - kind: ServiceAccount
    name: kafka-lab-deployer
    namespace: kafka-lab
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kafka-lab-deployer
---
apiVersion: v1
kind: Secret
metadata:
  name: kafka-lab-deployer-token
  namespace: kafka-lab
  annotations:
    kubernetes.io/service-account.name: kafka-lab-deployer
type: kubernetes.io/service-account-token
